[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winforge"
version = "1.0.0"
description = "Modular Windows customization and utilities suite (PowerToys-inspired)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "WinForge Contributors" }
]
keywords = ["windows", "customization", "powertoys", "utilities", "explorer", "taskbar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
winforge = "winforge.__main__:main"

[project.urls]
Homepage = "https://github.com/winforge/winforge"
Documentation = "https://github.com/winforge/winforge/tree/main/docs"
Repository = "https://github.com/winforge/winforge"
Issues = "https://github.com/winforge/winforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winforge = ["py.typed"]
